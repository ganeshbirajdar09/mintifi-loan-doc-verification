# ---------------------------------------------------------------------------
# Loan Application Document Verification Service
# Values without a default (callback secret, JWT keys in prod) must be
# provided via environment variables; startup fails otherwise.
# ---------------------------------------------------------------------------
quarkus.application.name=loan-doc-verification

# --- HTTP ---------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.limits.max-body-size=64K
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Cache-Control".value=no-store

# --- Datasource / ORM ---------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true
quarkus.datasource.devservices.image-name=postgres:16-alpine

# --- JSON ---------------------------------------------------------------
quarkus.jackson.fail-on-unknown-properties=true
quarkus.jackson.write-dates-as-timestamps=false

# --- Security -----------------------------------------------------------
# Every JAX-RS endpoint must declare @RolesAllowed / @PermitAll explicitly.
quarkus.security.jaxrs.deny-unannotated-endpoints=true
mp.jwt.verify.issuer=https://loan-verification.local
mp.jwt.verify.audiences=loan-verification-api
# Dev/test keys ship on the classpath for local use ONLY. The prod profile
# requires explicit locations (see %prod below and docker-compose.yml).
mp.jwt.verify.publickey.location=dev-keys/publicKey.pem
smallrye.jwt.sign.key.location=dev-keys/privateKey.pem
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${JWT_SIGNING_KEY_LOCATION:dev-keys/privateKey.pem}

# --- OpenAPI ------------------------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Loan Document Verification API

# --- Application --------------------------------------------------------
app.dev-auth.enabled=false
app.dev-auth.token-ttl=1h
%dev.app.dev-auth.enabled=true
%test.app.dev-auth.enabled=true

# Shared secret used by the provider to HMAC-sign callbacks. No default in prod.
%dev.app.provider.callback-secret=dev-only-callback-secret-change-me-0123456789
%test.app.provider.callback-secret=test-only-callback-secret-0123456789abcdef
app.provider.signature-tolerance=5m

app.verification.timeout=2m
app.verification.max-submissions=3
app.verification.backoff-base=2s
app.verification.backoff-max=1m

app.outbox.poll-interval=1s
app.outbox.batch-size=50

# Local simulator for the external verification provider
app.simulator.enabled=true
app.simulator.callback-url=http://localhost:${quarkus.http.port}/provider/callbacks
app.simulator.mode=AUTO
app.simulator.min-delay=500ms
app.simulator.max-delay=5s
app.simulator.submit-failure-rate=0.10
app.simulator.drop-rate=0.05
app.simulator.duplicate-rate=0.30
app.simulator.reject-rate=0.0

# --- Test profile -------------------------------------------------------
%test.app.simulator.callback-url=http://localhost:${quarkus.http.test-port:8081}/provider/callbacks
# Tests drive the outbox explicitly (with a controllable clock) instead of the background scheduler.
%test.quarkus.scheduler.enabled=false
%test.app.simulator.mode=MANUAL
%test.app.simulator.submit-failure-rate=0
%test.app.simulator.drop-rate=0
%test.app.simulator.duplicate-rate=0
%test.app.verification.max-submissions=2
%test.app.verification.timeout=1m
