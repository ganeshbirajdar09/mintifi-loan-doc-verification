services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loans
      POSTGRES_USER: loans
      POSTGRES_PASSWORD: loans
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loans -d loans"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/loans
      QUARKUS_DATASOURCE_USERNAME: loans
      QUARKUS_DATASOURCE_PASSWORD: loans
      # Local demo only. Use real secrets and an external IdP anywhere else.
      APP_PROVIDER_CALLBACK_SECRET: ${APP_PROVIDER_CALLBACK_SECRET:-compose-local-callback-secret-0123456789abcdef}
      APP_DEV_AUTH_ENABLED: "true"
      JWT_PUBLIC_KEY_LOCATION: dev-keys/publicKey.pem
      JWT_SIGNING_KEY_LOCATION: dev-keys/privateKey.pem
      # Simulator behaviour at startup (can be changed at runtime via /simulator/settings)
      APP_SIMULATOR_MODE: ${APP_SIMULATOR_MODE:-AUTO}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /q/health/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  pgdata:
